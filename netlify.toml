[build]
command="npm run build"
publish="dist"

[[redirects]]
from="/*"
to="/index.html"
status=200

[[headers]]
for="/sw.js"
[headers.values]
Cache-Control="no-cache, no-store, must-revalidate"

[[headers]]
for="/*"
[headers.values]
X-Content-Type-Options="nosniff"
Referrer-Policy="strict-origin-when-cross-origin"
Permissions-Policy="camera=(), microphone=(), geolocation=()"
